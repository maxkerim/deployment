global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Both colors are scraped. The idle one may be down/absent between deploys.
  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["app-blue:5000", "app-green:5000"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
