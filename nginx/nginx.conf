worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Written by deploy.sh. Defines `upstream app` (the live color) and $active_color.
    include /etc/nginx/upstream/upstream.conf;

    server {
        listen 80;

        add_header X-Active-Color $active_color always;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }

    # Internal-only (port is not published): scraped by nginx-exporter.
    server {
        listen 8081;

        location = /nginx_status {
            stub_status;
            access_log off;
        }
    }
}
