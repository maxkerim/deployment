# Blue-green stack: Redis (persistent data), two app colors, Nginx in front.
# Do not run `docker compose up` directly - use ./deploy.sh, which decides
# which color to start and when to switch traffic.

x-app: &app
  build:
    context: ./app
    args:
      APP_VERSION: ${APP_VERSION:-dev}
  restart: unless-stopped
  environment:
    APP_VERSION: ${APP_VERSION:-dev}
    # Overridable only so the e2e test can simulate a broken release.
    REDIS_HOST: ${REDIS_HOST:-redis}
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app-blue:
    <<: *app
    image: bluegreen-app-blue
    environment:
      APP_COLOR: blue
      APP_VERSION: ${APP_VERSION:-dev}
      REDIS_HOST: ${REDIS_HOST:-redis}

  app-green:
    <<: *app
    image: bluegreen-app-green
    environment:
      APP_COLOR: green
      APP_VERSION: ${APP_VERSION:-dev}
      REDIS_HOST: ${REDIS_HOST:-redis}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Directory (not a single file) so deploy.sh can swap upstream.conf atomically.
      - ${UPSTREAM_DIR:-./nginx/upstream}:/etc/nginx/upstream:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Monitoring (optional): docker compose --profile monitoring up -d ----

  nginx-exporter:
    profiles: [monitoring]
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ["--nginx.scrape-uri=http://nginx:8081/nginx_status"]
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
